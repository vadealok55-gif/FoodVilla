<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Food Villa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="" th:href="@{/css/Login.css}" />
</head>
<body>
    <div class="login-wrapper">

        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <h1>Food Villa</h1>
                <p>Join us today! Create an account to place orders, save your favorite meals, and experience lightning-fast delivery.</p>
            </div>
            <div class="left-footer">
                <p>&copy; 2024 Food Villa. All rights reserved.</p>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <div class="forms-container" style="max-width: 440px; margin: 0 auto;">

                <!-- REGISTER FORM -->
                <div class="form-card">
                    <div class="form-header">
                        <div class="form-icon user-icon">
                            <i class="fa-solid fa-user-plus"></i>
                        </div>
                        <div>
                            <h2>Create Account</h2>
                            <p class="subtitle">Sign up to get started</p>
                        </div>
                    </div>

                    <form th:action="@{/registerUser}" method="post">
                        
                        <!-- Removed u_id as it should be auto-generated by DB (IDENTITY) -->
                        
                        <div class="input-group">
                            <label for="uname">Full Name</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-id-card input-icon"></i>
                                <input type="text" id="uname" name="uname" placeholder="John Doe" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="uemail">Email Address</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-envelope input-icon"></i>
                                <input type="email" id="uemail" name="uemail" placeholder="john@example.com" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="unumber">Phone Number</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-phone input-icon"></i>
                                <input type="text" id="unumber" name="unumber" placeholder="9876543210" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="upassword">Password</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-lock input-icon"></i>
                                <input type="password" id="upassword" name="upassword" placeholder="Create a password (min 4 chars)" required minlength="4" maxlength="8">
                            </div>
                        </div>

                        <div class="error-msg" th:if="${error}" th:text="${error}"></div>
                        
                        <button type="submit" class="btn btn-user">
                            <i class="fa-solid fa-check"></i> Register Now
                        </button>
                        
                        <p class="register-link">
                            Already have an account? <a th:href="@{/login}">Sign in</a>
                        </p>
                    </form>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
