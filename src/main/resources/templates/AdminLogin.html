<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin Login — Food Villa</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link rel="stylesheet" href="" th:href="@{/css/Login.css}" />
</head>
<body>
	<div class="login-wrapper">

		<!-- LEFT PANEL -->
		<div class="left-panel">
			<div class="brand">
				<div class="brand-icon">
					<i class="fa-solid fa-shield-halved"></i>
				</div>
				<h1>Admin Portal</h1>
				<p>Manage your restaurant with ease. Access your dashboard, inventory, users, and orders all in one place.</p>
			</div>
			<div class="left-footer">
				<p>&copy; 2024 Food Villa. All rights reserved.</p>
			</div>
		</div>

		<!-- RIGHT PANEL -->
		<div class="right-panel">
			<div class="forms-container" style="max-width: 400px; margin: 0 auto;">

				<!-- ADMIN LOGIN -->
				<div class="form-card" id="admin-form">
					<div class="form-header">
						<div class="form-icon admin-icon">
							<i class="fa-solid fa-lock"></i>
						</div>
						<div>
							<h2>Admin Login</h2>
							<p class="subtitle">Secure access for staff only</p>
						</div>
					</div>

					<form th:action="@{/adminLogin}" method="post">
						<div class="input-group">
							<label for="adminEmail">Email Address</label>
							<div class="input-wrapper">
								<i class="fa-solid fa-envelope input-icon"></i>
								<input type="email" id="adminEmail" name="email" placeholder="admin@foodvilla.com" required>
							</div>
						</div>
						<div class="input-group">
							<label for="adminPassword">Password</label>
							<div class="input-wrapper">
								<i class="fa-solid fa-key input-icon"></i>
								<input type="password" id="adminPassword" name="password" placeholder="Enter your password" required>
							</div>
						</div>
						<div class="error-msg" th:if="${error}" th:text="${error}"></div>
						<button type="submit" class="btn btn-admin">
							<i class="fa-solid fa-right-to-bracket"></i> Sign In as Admin
						</button>
						<p class="register-link" style="margin-top: 16px;">
							<a th:href="@{/home}"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
						</p>
					</form>
				</div>

			</div>
		</div>
	</div>
</body>
</html>
